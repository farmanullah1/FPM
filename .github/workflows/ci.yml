name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Show SDK version
        run: dotnet --version

      - name: Restore
        run: dotnet restore app/PCManager.sln

      - name: Build (warnings are errors)
        run: dotnet build app/PCManager.sln -c Release --no-restore -nodeReuse:false -m:1 -warnaserror

      - name: Test
        run: dotnet test app/tests/PCManager.Tests/PCManager.Tests.csproj -c Release --no-build -nodeReuse:false

  ui-gates:
    name: UI gates (tokens, contrast, icons)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: XAML token lint
        shell: powershell
        run: .\tools\lint-xaml.ps1

      - name: Contrast check
        shell: powershell
        run: .\tools\contrast-check.ps1

      - name: Icon generator check
        run: dotnet run --project tools/IconGen -- --check

  secret-scan:
    name: Secret scan (full history)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan every commit with gitleaks
        shell: powershell
        run: .\tools\secret-scan.ps1
