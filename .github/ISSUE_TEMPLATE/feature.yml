name: Feature request
description: Suggest a capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should FPM do, and where?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: |
        Does this delete, uninstall or change system state? If so, describe the scan → review →
        approval → verify → undo flow it would use.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: This does not require telemetry, accounts or remote execution.
          required: true
        - label: This does not copy Microsoft/Google assets or run third-party scripts.
          required: true
